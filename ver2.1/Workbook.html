<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Silver 対策問題集</title>
    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>
<body>

    <h1>Java Silver 対策問題集</h1>

    <div class="container">
        <!-- 左カラム全体 -->
        <div class="left-column">
            <!-- 章リスト用の sidebar -->
            <div class="sidebar">
                <h2>章を選択</h2>
                <ul class="list-group" id="chapterList">
                    <li class="list-item active" data-chapter="all">すべての問題</li>
                </ul>
            </div>

            <!-- 完全独立したメソッドメモ用の div -->
            <div class="reference-box">
                <h2>リファレンス</h2>
                <ul class="list-group">
                    <li class="list-item" data-chapter="method-memo">メソッドメモ</li>
                </ul>
            </div>
        </div>

        <!-- 右カラム：問題一覧（JSで動的生成） -->
        <div class="main-content">
            <h2 id="mainHeading">すべての問題</h2>
            <div id="questionContainer"></div>
        </div>
    </div>

    <!-- 2. リファレンスデータ -->
    <script src="methods.js"></script>

    <!-- 3. questions ディレクトリ内の各章ファイルを順番に読み込む -->
    <script src="questions/ch01.js"></script>
    <script src="questions/ch02.js"></script>
    <script src="questions/ch03.js"></script>
    <script src="questions/ch04.js"></script>
    <script src="questions/ch05.js"></script>
    <script src="questions/ch06.js"></script>
    <script src="questions/ch07.js"></script>
    <script src="questions/ch08.js"></script>
    <script src="questions/ch09.js"></script>
    <script src="questions/ch10.js"></script>
    <script src="questions/ch11.js"></script>
    <script src="questions/ch12.js"></script>

    <!-- 4. メイン処理（最後に読み込む） -->
    <script src="app.js"></script>
</body>
</html>
